<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지금 세종 교통</title>
<meta name="description" content="세종 도로가 지금 어디서 막히는지 색으로 한눈에 — 청사 바로가기와 교통 CCTV">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{
  --bg:#fff;--ink:#16181d;--sub:#5d6470;--line:#e3e6eb;--chip:#f3f5f8;--accent:#1f6feb;
  --go:#22a35a;--slow:#e6a700;--jam:#e0383e;--shadow:0 2px 10px rgba(20,24,32,.12);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{position:relative;z-index:5;background:var(--bg);box-shadow:0 1px 0 var(--line)}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:#fff1e6;color:#b4530c;white-space:nowrap}
.badge[hidden]{display:none}
.spacer{flex:1}
.stamp{font-size:12px;color:var(--sub);white-space:nowrap}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;height:34px;min-width:34px;padding:0 9px;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.icon-btn:active{background:var(--chip)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;
  font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip select{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:0 14px 0 0;font-size:14px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:right 4px center,right 0 center;background-size:4px 4px;background-repeat:no-repeat;cursor:pointer}
main{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:#eef1f4}
.legend{position:absolute;left:10px;bottom:calc(12px + var(--safe-b));z-index:3;background:rgba(255,255,255,.95);
  border-radius:10px;box-shadow:var(--shadow);padding:7px 10px;font-size:12px;display:flex;gap:10px;align-items:center}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle}
.fab{position:absolute;right:10px;bottom:calc(12px + var(--safe-b));z-index:3;display:flex;flex-direction:column;gap:8px}
.fab button{width:auto;min-width:48px;height:44px;padding:0 12px;border:0;border-radius:12px;background:#fff;box-shadow:var(--shadow);
  font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.fab button.on{background:var(--ink);color:#fff}
.fab svg{width:18px;height:18px}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:4;background:rgba(22,24,29,.88);color:#fff;
  padding:7px 12px;border-radius:999px;font-size:13px;max-width:92%;text-align:center;pointer-events:none;
  opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
/* 지도 위 CCTV 표시 */
.cam{transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--accent);
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer;padding:0}
.cam svg{width:15px;height:15px;color:var(--accent)}
.me{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 6px rgba(31,111,235,.2);
  transform:translate(-50%,-50%)}
/* 아래에서 올라오는 창 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:16px 16px 0 0;
  padding:14px 16px calc(16px + var(--safe-b));max-height:86vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease;
  box-shadow:0 -4px 20px rgba(0,0,0,.15)}
.sheet.open{transform:none}
.sheet-bg.open{display:block}
.sheet h2{font-size:17px;margin:0 0 2px}
.sheet .meta{font-size:13px;color:var(--sub);margin-bottom:10px}
.sheet video{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;display:block}
.sheet .row{display:flex;gap:8px;margin-top:12px}
.sheet .row a,.sheet .row button{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:10px;
  padding:10px;background:#fff;font-size:14px;color:var(--ink);cursor:pointer}
.sheet p{margin:8px 0;font-size:14px}
.sheet ul{padding-left:18px;margin:6px 0;font-size:14px}
.sheet .note{font-size:12px;color:var(--sub)}
/* 설정 안내 화면 */
.setup{position:absolute;inset:0;z-index:6;background:#f6f7f9;overflow:auto;padding:24px 18px calc(24px + var(--safe-b))}
.setup[hidden]{display:none}
.card{max-width:560px;margin:0 auto;background:#fff;border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.card h2{margin:0 0 6px;font-size:18px}
.card ol{padding-left:20px;margin:10px 0}
.card li{margin:6px 0}
.card code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:13px}
.card .note{color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="top">
      <h1 id="title">지금 세종 교통</h1>
      <span class="badge" id="rush" hidden></span>
      <span class="spacer"></span>
      <span class="stamp" id="stamp"></span>
      <button class="icon-btn" id="refresh" aria-label="교통정보 새로고침" title="새로고침">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
      <button class="icon-btn" id="infoBtn" aria-label="안내">?</button>
    </div>
    <nav class="chips" id="chips" aria-label="바로가기"></nav>
  </header>
  <main>
    <div id="map" role="application" aria-label="세종 실시간 교통 지도"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="legend" id="legend" aria-label="범례">
      <span><i style="background:var(--go)"></i>원활</span>
      <span><i style="background:var(--slow)"></i>서행</span>
      <span><i style="background:var(--jam)"></i>정체</span>
    </div>
    <div class="fab">
      <button id="locBtn" aria-label="내 위치로">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <button id="cctvBtn" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="14" height="10" rx="2"/><path d="M16 11l6-3v8l-6-3z"/></svg>CCTV
      </button>
      <button id="trafficBtn" class="on" aria-pressed="true">교통</button>
    </div>
    <section class="setup" id="setup" hidden></section>
  </main>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div id="sheetBody"></div>
</section>

<script>
(function(){
'use strict';

/* ───────── 지역 설정 ─────────
   다른 지역을 늘릴 때는 아래에 지역을 하나 더 추가하면 됩니다(주소 뒤 #지역코드로 엽니다).
   lv = 카카오 지도 확대 수준(숫자가 작을수록 가까이). */
var REGIONS = {
  sejong: {
    name: '세종', center: [36.5000, 127.2800], level: 7,
    spots: [
      { id: 'gov1', t: '정부세종청사', lat: 36.5035, lng: 127.2650, lv: 4 },
      { id: 'gov2', t: '2청사', lat: 36.4845, lng: 127.2605, lv: 4 },
      { id: 'cityhall', t: '세종시청', lat: 36.4801, lng: 127.2890, lv: 4 },
      { id: 'osong', t: '오송역', lat: 36.6203, lng: 127.3270, lv: 5 },
      { id: 'jochiwon', t: '조치원', lat: 36.6014, lng: 127.2985, lv: 5 },
      { id: 'daejeon', t: '대전 방면(반석역)', lat: 36.3917, lng: 127.3147, lv: 5 }
    ],
    // 내 사무실: 정부세종청사 동별 위치('오늘 뭐 먹지'와 같은 좌표)
    offices: [
      ['b1', '1동 (국무조정실)', 36.5033, 127.2714], ['b2', '2동 (공정위)', 36.5044, 127.2684],
      ['b3', '3동 (청사관리본부)', 36.5055, 127.2676], ['b4', '4동 (과기정통부)', 36.5061, 127.2665],
      ['b5', '5동 (기획예산처·농식품부)', 36.5047, 127.2654], ['b6', '6동 (국토부·기후부)', 36.5055, 127.2627],
      ['b7', '7동 (법제처·권익위)', 36.5060, 127.2593], ['b8', '8동 (우정사업본부)', 36.5047, 127.2592],
      ['b9', '9동 (보훈부)', 36.5031, 127.2613], ['b10', '10동 (복지부)', 36.5025, 127.2621],
      ['b11', '11동 (고용부)', 36.5013, 127.2614], ['b12', '12동 (고용부·교육부)', 36.5002, 127.2612],
      ['b13', '13동 (산업부)', 36.4991, 127.2610], ['b14', '14동 (교육부)', 36.4993, 127.2658],
      ['b15', '15동 (문체부)', 36.4975, 127.2659], ['bc', '중앙동 (재경부·행안부)', 36.5024, 127.2652],
      ['b16', '2청사 16동 (국세청)', 36.4853, 127.2604], ['b17', '2청사 17동 (인사처·소방청)', 36.4835, 127.2607]
    ]
  }
};

var REFRESH_MIN = 5;              // 교통정보 자동 새로고침 간격(분)
var CCTV_MAX_LEVEL = 8;           // 이보다 멀리 보면 CCTV를 부르지 않습니다
var KEY_OFFICE = 'sejongtraffic.office';

var $ = function (id) { return document.getElementById(id); };
var hash = (location.hash || '').replace(/^#/, '').split('@');
var REGION_ID = REGIONS[hash[0]] ? hash[0] : 'sejong';
var R = REGIONS[REGION_ID];
var startSpot = hash[1] || '';

var map = null, trafficOn = true, cctvOn = false, cctvMarks = [], cctvTimer = null, cctvSeq = 0, meMark = null;
var cfg = { kakaoKey: '', cctv: false };

/* ───────── 작은 도구들 ───────── */
function el(tag, attrs, kids) {
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    if (k === 'text') e.textContent = attrs[k];
    else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { e.addEventListener(ev, attrs.on[ev]); });
    else e.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
var toastT = null;
function toast(msg, ms) {
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, ms || 2400);
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function stamp() { var d = new Date(); $('stamp').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' 기준'; }
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/* 출퇴근 시간대 표시(평일 07:00~09:30, 17:30~19:30) */
function rushBadge() {
  var d = new Date(), wd = d.getDay(), m = d.getHours() * 60 + d.getMinutes(), b = $('rush');
  var txt = '';
  if (wd >= 1 && wd <= 5) {
    if (m >= 420 && m < 570) txt = '출근 시간대';
    else if (m >= 1050 && m < 1170) txt = '퇴근 시간대';
  }
  b.textContent = txt; b.hidden = !txt;
}

/* ───────── 바로가기 칩 ───────── */
function goTo(lat, lng, lv) {
  if (!map) return;
  map.setLevel(lv, { animate: false });
  map.panTo(new kakao.maps.LatLng(lat, lng));
}
function renderChips() {
  var box = $('chips'); box.innerHTML = '';
  box.appendChild(el('button', { class: 'chip', type: 'button', text: '전체', on: { click: function () { setActive(this); goTo(R.center[0], R.center[1], R.level); } } }));
  R.spots.forEach(function (s) {
    box.appendChild(el('button', { class: 'chip', type: 'button', 'data-id': s.id, text: s.t,
      on: { click: function () { setActive(this); goTo(s.lat, s.lng, s.lv); history.replaceState(null, '', '#' + REGION_ID + '@' + s.id); } } }));
  });
  if (R.offices && R.offices.length) {
    var sel = el('select', { 'aria-label': '내 사무실', id: 'officeSel' });
    sel.appendChild(el('option', { value: '', text: '내 사무실' }));
    R.offices.forEach(function (o) { sel.appendChild(el('option', { value: o[0], text: o[1] })); });
    var saved = load(KEY_OFFICE);
    if (saved) sel.value = saved;
    sel.addEventListener('change', function () {
      var o = officeById(sel.value); if (!o) return;
      store(KEY_OFFICE, o[0]); setActive(wrap); goTo(o[2], o[3], 3);
    });
    var wrap = el('span', { class: 'chip' }, [sel]);
    box.appendChild(wrap);
  }
}
function officeById(id) { for (var i = 0; i < R.offices.length; i++) if (R.offices[i][0] === id) return R.offices[i]; return null; }
function setActive(btn) {
  Array.prototype.forEach.call($('chips').children, function (c) { c.classList.toggle('on', c === btn); });
}

/* ───────── 교통정보 ───────── */
function setTraffic(on) {
  trafficOn = on;
  if (map) { if (on) map.addOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC); else map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC); }
  $('trafficBtn').classList.toggle('on', on); $('trafficBtn').setAttribute('aria-pressed', String(on));
  $('legend').style.display = on ? '' : 'none';
}
function refreshTraffic(quiet) {
  if (map && trafficOn) { map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC); map.addOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC); }
  stamp(); rushBadge();
  if (cctvOn) loadCctv(true);
  if (!quiet) toast('교통정보를 새로 불러왔어요');
}

/* ───────── CCTV ───────── */
var CAM_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="2" y="7" width="14" height="10" rx="2"/><path d="M16 11l6-3v8l-6-3z"/></svg>';
function clearCctv() { cctvMarks.forEach(function (m) { m.setMap(null); }); cctvMarks = []; }
function setCctv(on) {
  if (on && !cfg.cctv) { openInfo('cctv'); return; }
  cctvOn = on;
  $('cctvBtn').classList.toggle('on', on); $('cctvBtn').setAttribute('aria-pressed', String(on));
  if (on) loadCctv(); else clearCctv();
}
function scheduleCctv() { if (!cctvOn) return; clearTimeout(cctvTimer); cctvTimer = setTimeout(loadCctv, 450); }
function loadCctv(force) {
  if (!map || !cctvOn) return;
  if (map.getLevel() > CCTV_MAX_LEVEL) { clearCctv(); toast('조금 더 확대하면 CCTV가 보여요'); return; }
  var b = map.getBounds(), sw = b.getSouthWest(), ne = b.getNorthEast();
  var q = 'minX=' + sw.getLng().toFixed(3) + '&maxX=' + ne.getLng().toFixed(3) + '&minY=' + sw.getLat().toFixed(3) + '&maxY=' + ne.getLat().toFixed(3);
  var seq = ++cctvSeq;
  fetch('/api/cctv?' + q, { cache: force ? 'no-store' : 'default' }).then(function (r) { return r.json(); }).then(function (j) {
    if (seq !== cctvSeq || !cctvOn) return;
    clearCctv();
    if (!j || !j.ok) { toast(j && j.error === 'its_key_missing' ? 'CCTV 키가 아직 설정되지 않았어요' : 'CCTV 정보를 불러오지 못했어요'); return; }
    if (!j.cctv.length) { toast('이 범위에는 공개된 교통 CCTV가 없어요'); return; }
    j.cctv.forEach(function (c) {
      var btn = el('button', { class: 'cam', type: 'button', 'aria-label': c.name + ' CCTV 보기', title: c.name });
      btn.innerHTML = CAM_SVG;
      btn.addEventListener('click', function (ev) { ev.stopPropagation(); openCctv(c); });
      var ov = new kakao.maps.CustomOverlay({ position: new kakao.maps.LatLng(c.lat, c.lng), content: btn, yAnchor: 0.5, xAnchor: 0.5, zIndex: 2, clickable: true });
      ov.setMap(map); cctvMarks.push(ov);
    });
  }).catch(function () { if (seq === cctvSeq) toast('CCTV 정보를 불러오지 못했어요'); });
}

var hlsLoading = null, hls = null;
function loadHls() {
  if (window.Hls) return Promise.resolve(window.Hls);
  if (hlsLoading) return hlsLoading;
  hlsLoading = new Promise(function (ok, no) {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js';
    s.onload = function () { ok(window.Hls); }; s.onerror = no;
    document.head.appendChild(s);
  });
  return hlsLoading;
}
function stopVideo() { if (hls) { try { hls.destroy(); } catch (e) {} hls = null; } }
function openCctv(c) {
  var body = $('sheetBody'); body.innerHTML = '';
  var video = el('video', { controls: '', autoplay: '', muted: '', playsinline: '', 'webkit-playsinline': '' });
  video.muted = true;
  var msg = el('p', { class: 'note', text: '영상을 불러오는 중…' });
  body.appendChild(el('h2', { id: 'sheetTitle', text: c.name }));
  body.appendChild(el('div', { class: 'meta', text: c.road + ' 교통 CCTV · 국가교통정보센터 제공' }));
  body.appendChild(video); body.appendChild(msg);
  body.appendChild(el('div', { class: 'row' }, [
    el('a', { href: c.url, target: '_blank', rel: 'noopener', text: '새 창에서 열기' }),
    el('button', { type: 'button', text: '닫기', on: { click: closeSheet } })
  ]));
  openSheet();
  if (location.protocol === 'https:' && /^http:/i.test(c.url)) {
    msg.textContent = '이 카메라는 보안 연결(HTTPS) 영상을 주지 않아 여기서는 재생되지 않아요. ‘새 창에서 열기’를 눌러 보세요.';
    return;
  }
  var ok = function () { msg.textContent = '실시간 영상입니다. 몇 초 늦을 수 있어요.'; };
  var bad = function () { msg.textContent = '영상을 재생하지 못했어요. 카메라 점검 중이거나 주소가 바뀌었을 수 있어요.'; };
  video.addEventListener('playing', ok, { once: true });
  var isHls = /m3u8/i.test(c.url) || /hls/i.test(c.format);
  if (!isHls || video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = c.url; video.play().catch(function () {}); video.addEventListener('error', bad, { once: true });
    return;
  }
  loadHls().then(function (Hls) {
    if (!Hls.isSupported()) { bad(); return; }
    stopVideo(); hls = new Hls({ lowLatencyMode: true });
    hls.on(Hls.Events.ERROR, function (e, d) { if (d && d.fatal) bad(); });
    hls.loadSource(c.url); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function () { video.play().catch(function () {}); });
  }).catch(bad);
}

/* ───────── 아래 창(안내·CCTV) ───────── */
function openSheet() { $('sheet').classList.add('open'); $('sheetBg').classList.add('open'); }
function closeSheet() {
  $('sheet').classList.remove('open'); $('sheetBg').classList.remove('open');
  stopVideo(); var v = $('sheetBody').querySelector('video'); if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
}
function openInfo(topic) {
  var body = $('sheetBody'); body.innerHTML = '';
  body.appendChild(el('h2', { id: 'sheetTitle', text: topic === 'cctv' ? 'CCTV는 준비 중이에요' : '지금 세종 교통' }));
  if (topic === 'cctv') {
    body.appendChild(el('p', { text: '교통 CCTV를 보려면 관리자가 국가교통정보센터(ITS) 오픈API 인증키를 넣어야 해요. 키가 들어가면 이 버튼으로 지도 위 카메라를 볼 수 있습니다.' }));
  } else {
    body.appendChild(el('p', { text: '세종 도로가 지금 어디서 막히는지 색으로 보여주는 지도예요. 출발 전에 열어 보세요.' }));
    body.appendChild(el('ul', null, [
      el('li', { text: '초록은 원활, 노랑은 서행, 빨강은 정체예요(카카오 실시간 교통정보 기준).' }),
      el('li', { text: '위쪽 칩으로 청사·오송역·대전 방면으로 바로 이동하고, ‘내 사무실’을 고르면 기억해 둬요.' }),
      el('li', { text: 'CCTV 버튼을 켜면 고속도로·국도 교통 CCTV를 볼 수 있어요. 시내 도로에는 공개 카메라가 적어요.' }),
      el('li', { text: '교통정보는 ' + REFRESH_MIN + '분마다 자동으로 새로고침돼요.' })
    ]));
    body.appendChild(el('p', { class: 'note', text: '참고용 정보입니다. 운전 중에는 조작하지 마세요. 이 서비스는 개인이 공개된 데이터로 만든 것으로 정부·지자체의 공식 서비스가 아닙니다. 교통정보: 카카오맵 · CCTV: 국토교통부 국가교통정보센터.' }));
  }
  body.appendChild(el('div', { class: 'row' }, [
    el('button', { type: 'button', text: '링크 복사', on: { click: copyLink } }),
    el('button', { type: 'button', text: '닫기', on: { click: closeSheet } })
  ]));
  openSheet();
}
function copyLink() {
  var url = location.origin + location.pathname + location.hash;
  if (navigator.share) { navigator.share({ title: document.title, url: url }).catch(function () {}); return; }
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { toast('링크를 복사했어요'); }, function () { toast(url, 5000); });
}

/* ───────── 내 위치 ───────── */
function locate() {
  if (!navigator.geolocation) { toast('이 기기에서는 위치를 쓸 수 없어요'); return; }
  toast('내 위치를 찾는 중…');
  navigator.geolocation.getCurrentPosition(function (p) {
    var pos = new kakao.maps.LatLng(p.coords.latitude, p.coords.longitude);
    if (!meMark) meMark = new kakao.maps.CustomOverlay({ position: pos, content: el('div', { class: 'me', 'aria-label': '내 위치' }), zIndex: 3 });
    meMark.setPosition(pos); meMark.setMap(map); map.setLevel(4, { animate: false }); map.panTo(pos); setActive(null);
  }, function () { toast('위치 권한을 허용해야 내 위치를 볼 수 있어요'); }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
}

/* ───────── 설정 안내(키가 없을 때) ───────── */
function showSetup(reason) {
  var s = $('setup'); s.hidden = false; s.innerHTML = '';
  var origin = location.origin && location.origin !== 'null' ? location.origin : '(배포한 주소)';
  var card = el('div', { class: 'card' }, [
    el('h2', { text: reason === 'sdk' ? '카카오 지도를 불러오지 못했어요' : '지도 키 설정이 필요해요' }),
    el('p', { class: 'note', text: reason === 'sdk'
      ? '카카오디벨로퍼스 앱의 [플랫폼 → Web]에 이 주소가 등록돼 있는지, [카카오맵] 사용 설정이 ON인지 확인해 주세요.'
      : reason === 'api' ? '설정 정보를 읽지 못했어요. Vercel에 배포한 주소에서 열어 주세요.' : '관리자가 한 번만 하면 됩니다.' }),
    el('ol', null, [
      el('li', { text: 'developers.kakao.com → 내 애플리케이션 → 앱 만들기' }),
      el('li', { text: '[카카오맵] → 사용 설정을 ON' }),
      el('li', null, ['[플랫폼 → Web] 사이트 도메인에 ', el('code', { text: origin }), ' 등록']),
      el('li', null, ['[앱 키]의 JavaScript 키를 Vercel 환경변수 ', el('code', { text: 'KAKAO_JS_KEY' }), '에 넣고 다시 배포(Redeploy)']),
      el('li', null, ['(선택) CCTV: ITS 국가교통정보센터 인증키를 ', el('code', { text: 'ITS_API_KEY' }), '에 넣기'])
    ]),
    el('p', { class: 'note', text: '자세한 방법은 저장소의 README를 보세요.' })
  ]);
  s.appendChild(card);
}

/* ───────── 시작 ───────── */
function loadKakao(key) {
  return new Promise(function (ok, no) {
    var s = document.createElement('script');
    s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey=' + encodeURIComponent(key);
    var t = setTimeout(function () { no(new Error('timeout')); }, 12000);
    s.onload = function () {
      if (!window.kakao || !kakao.maps || !kakao.maps.load) { clearTimeout(t); no(new Error('sdk')); return; }
      kakao.maps.load(function () { clearTimeout(t); ok(); });
    };
    s.onerror = function () { clearTimeout(t); no(new Error('sdk')); };
    document.head.appendChild(s);
  });
}

function startMap() {
  var spot = null;
  R.spots.forEach(function (s) { if (s.id === startSpot) spot = s; });
  var office = !spot && startSpot ? officeById(startSpot) : null;
  var c = spot ? [spot.lat, spot.lng] : office ? [office[2], office[3]] : R.center;
  map = new kakao.maps.Map($('map'), { center: new kakao.maps.LatLng(c[0], c[1]), level: spot ? spot.lv : office ? 3 : R.level });
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  setTraffic(true);
  kakao.maps.event.addListener(map, 'idle', scheduleCctv);
  if (spot) Array.prototype.forEach.call($('chips').children, function (ch) { if (ch.getAttribute('data-id') === spot.id) ch.classList.add('on'); });
  stamp(); rushBadge();
  setInterval(function () { if (!document.hidden) refreshTraffic(true); }, REFRESH_MIN * 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshTraffic(true); });
}

document.title = '지금 ' + R.name + ' 교통';
$('title').textContent = '지금 ' + R.name + ' 교통';
renderChips();
$('refresh').addEventListener('click', function () { refreshTraffic(false); });
$('infoBtn').addEventListener('click', function () { openInfo(); });
$('trafficBtn').addEventListener('click', function () { setTraffic(!trafficOn); });
$('cctvBtn').addEventListener('click', function () { setCctv(!cctvOn); });
$('locBtn').addEventListener('click', function () { if (map) locate(); });
$('sheetBg').addEventListener('click', closeSheet);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

fetch('/api/config', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('api'); return r.json(); })
  .then(function (j) {
    cfg = j || cfg;
    if (!cfg.kakaoKey) { showSetup('key'); return; }
    return loadKakao(cfg.kakaoKey).then(startMap, function () { showSetup('sdk'); });
  })
  .catch(function () { showSetup('api'); });
})();
</script>
